<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">

    <title>Light Control · Pro</title>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                "Segoe UI", Roboto, Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(80, 80, 255, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 120, 80, 0.12), transparent 40%),
                #08080d;

            transition: background 0.8s ease;
            overflow: hidden;
        }

        body.light-on {
            background:
                radial-gradient(circle at 50% 20%, rgba(255, 190, 100, 0.20), transparent 45%),
                radial-gradient(circle at 20% 80%, rgba(255, 130, 60, 0.10), transparent 45%),
                #120f0b;
        }

        /* Liquid Background */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            animation: liquidMove 15s infinite alternate ease-in-out;
        }

        body::before {
            background: #6366f1;
            top: -150px;
            left: -150px;
        }

        body::after {
            background: #f97316;
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }

        @keyframes liquidMove {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(100px, 80px) scale(1.3);
            }
        }

        /* Main Container */
        .container {
            position: relative;
            width: 420px;
            padding: 48px 36px 40px;

            border-radius: 64px;

            background: rgba(255, 255, 255, 0.045);

            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);

            border: 1px solid rgba(255, 255, 255, 0.08);

            box-shadow:
                0 50px 100px -30px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);

            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.08),
                    transparent 35%,
                    rgba(255, 255, 255, 0.02)
                );

            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
        }

        .brand {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 8px;
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -1px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #94a3b8
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.5px;
            margin-bottom: 36px;
        }

        /* Status */
        .status-display {
            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;

            margin-bottom: 36px;
            padding: 32px 20px 28px;

            border-radius: 48px;

            background: rgba(255, 255, 255, 0.025);

            border: 1px solid rgba(255, 255, 255, 0.05);

            overflow: hidden;
        }

        .status-display.on {
            background: rgba(255, 190, 100, 0.06);
        }

        .status-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 12px;
        }

        .status {
            font-size: 34px;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .status.on {
            color: #f5e6d3;
            text-shadow: 0 0 35px rgba(255, 200, 100, 0.3);
        }

        .status.off {
            color: rgba(255, 255, 255, 0.35);
        }

        .state-dot {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            margin-top: 16px;

            font-size: 24px;

            transition: 0.5s ease;
        }

        .state-dot.on {
            background: radial-gradient(
                circle at 30% 30%,
                #fff8ee,
                #f5d9a8
            );

            box-shadow:
                0 0 60px rgba(255, 200, 100, 0.3),
                0 0 120px rgba(255, 200, 100, 0.15);

            animation: bulbPulse 3s infinite ease-in-out;
        }

        .state-dot.off {
            background: rgba(255, 255, 255, 0.05);
        }

        @keyframes bulbPulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
        }

        button {
            flex: 1;

            padding: 20px 14px;

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;

            font-size: 17px;
            font-weight: 600;

            color: white;

            cursor: pointer;

            backdrop-filter: blur(15px);

            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
        }

        button:active {
            transform: scale(0.95);
        }

        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .btn-on {
            background: rgba(52, 211, 153, 0.08);
            color: #a7f3d0;
        }

        .btn-on:hover {
            background: rgba(52, 211, 153, 0.18);
        }

        .btn-off {
            background: rgba(248, 113, 113, 0.07);
            color: #fca5a5;
        }

        .btn-off:hover {
            background: rgba(248, 113, 113, 0.16);
        }

        .footer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        /* SweetAlert */
        .custom-swal {
            width: min(380px, calc(100vw - 24px)) !important;

            border-radius: 32px !important;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.025)
                ) !important;

            backdrop-filter: blur(35px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(35px) saturate(180%) !important;

            border: 1px solid rgba(255, 255, 255, 0.10) !important;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.08) !important;

            color: white !important;
        }

        .custom-swal .swal2-title {
            color: #f1f5f9 !important;
            font-size: 22px !important;
        }

        .custom-swal .swal2-html-container {
            color: rgba(255, 255, 255, 0.6) !important;
        }

        /* Only ONE custom progress bar */
        #swalProgress {
            width: 0%;
            height: 4px;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #818cf8
            );

            border-radius: 20px;

            transition: width 0.1s linear;

            box-shadow:
                0 0 20px rgba(96, 165, 250, 0.5);
        }

        /* Mobile */
        @media (max-width: 480px) {

            body {
                padding: 12px;
            }

            .container {
                width: 100%;
                padding: 36px 20px 32px;
                border-radius: 42px;
            }

            h1 {
                font-size: 30px;
            }

            .buttons {
                flex-direction: column;
                gap: 12px;
            }

            button {
                width: 100%;
                padding: 17px;
            }

            .status {
                font-size: 28px;
            }

            .status-display {
                padding: 25px 16px;
                border-radius: 34px;
            }

            .custom-swal {
                width: calc(100vw - 24px) !important;
                max-width: 380px !important;
                margin: 12px !important;
                border-radius: 28px !important;
            }

            .custom-swal .swal2-title {
                font-size: 20px !important;
            }

            .custom-swal .swal2-html-container {
                font-size: 14px !important;
                margin: 12px 8px !important;
            }

            .swal2-container {
                padding: 12px !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="content">

            <div class="brand">· iot ·</div>

            <h1>Light Control</h1>

            <div class="subtitle">
                developed by Dinuka dev
            </div>

            <div class="status-display" id="statusDisplay">

                <div class="status-label">
                    current state
                </div>

                <div class="status off" id="status">
                    Connecting...
                </div>

                <div class="state-dot off" id="stateDot">
                    💡
                </div>

            </div>

            <div class="buttons">

                <button
                    class="btn-on"
                    id="onButton">

                    Turn On

                </button>

                <button
                    class="btn-off"
                    id="offButton">

                    Turn Off

                </button>

            </div>

            <div class="footer">
                ✦ real-time · iot ✦
            </div>

        </div>

    </div>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            set,
            onValue
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


        // Firebase Configuration
        const firebaseConfig = {

            apiKey: "AIzaSyB8YbWMEOLP3T9oqNibQOx3hXhcmXmzn9A",

            authDomain: "led-automated-switch.firebaseapp.com",

            projectId: "led-automated-switch",

            storageBucket: "led-automated-switch.firebasestorage.app",

            messagingSenderId: "313118537988",

            appId: "1:313118537988:web:2d3fd8f473ffdeb9637851",

            measurementId: "G-5JX5NGDHN0"

        };


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);

        const lightRef = ref(
            database,
            "devices/light"
        );


        // DOM Elements
        const body = document.body;

        const statusEl =
            document.getElementById("status");

        const statusDisplay =
            document.getElementById("statusDisplay");

        const dotEl =
            document.getElementById("stateDot");

        const onBtn =
            document.getElementById("onButton");

        const offBtn =
            document.getElementById("offButton");


        // Update UI
        function updateUI(lightState) {

            if (lightState === true) {

                statusEl.textContent = "On";

                statusEl.className =
                    "status on";

                statusDisplay.className =
                    "status-display on";

                dotEl.className =
                    "state-dot on";

                body.classList.add(
                    "light-on"
                );

            } else {

                statusEl.textContent = "Off";

                statusEl.className =
                    "status off";

                statusDisplay.className =
                    "status-display";

                dotEl.className =
                    "state-dot off";

                body.classList.remove(
                    "light-on"
                );
            }
        }


        // Show Processing Alert
        function showProcessingAlert(targetState) {

            return new Promise((resolve) => {

                const title =
                    targetState
                        ? "Turning On"
                        : "Turning Off";


                Swal.fire({

                    title: title,

                    html: `

                        <div style="
                            margin: 14px 0;
                            font-size: 14px;
                            opacity: 0.55;
                        ">
                            Processing your request...
                        </div>

                        <div style="
                            width: 100%;
                            height: 4px;
                            background: rgba(255,255,255,0.08);
                            border-radius: 20px;
                            overflow: hidden;
                        ">

                            <div id="swalProgress"></div>

                        </div>

                    `,

                    showConfirmButton: false,

                    allowOutsideClick: false,

                    allowEscapeKey: false,

                    // IMPORTANT: No timerProgressBar
                    timer: 1800,

                    showClass: {
                        popup: "swal2-show"
                    },

                    hideClass: {
                        popup: "swal2-hide"
                    },

                    customClass: {
                        popup: "custom-swal"
                    },

                    backdrop:
                        "rgba(0,0,0,0.55)",

                    didOpen: () => {

                        const progress =
                            document.getElementById(
                                "swalProgress"
                            );

                        const start =
                            Date.now();

                        const duration =
                            1800;


                        function animate() {

                            const elapsed =
                                Date.now() - start;

                            const percentage =
                                Math.min(
                                    (elapsed / duration) * 100,
                                    100
                                );

                            if (progress) {

                                progress.style.width =
                                    percentage + "%";

                            }

                            if (percentage < 100) {

                                requestAnimationFrame(
                                    animate
                                );

                            }

                        }

                        requestAnimationFrame(
                            animate
                        );

                    }

                }).then(() => {

                    resolve();

                });

            });

        }


        // Change Light State
        async function changeLightState(
            newState
        ) {

            onBtn.disabled = true;

            offBtn.disabled = true;


            try {

                // Update Firebase
                await set(
                    lightRef,
                    newState
                );


                // Show processing alert
                await showProcessingAlert(
                    newState
                );


                // Update UI
                updateUI(
                    newState
                );


                // Success Alert
                await Swal.fire({

                    icon:
                        newState
                            ? "success"
                            : "info",

                    title:
                        newState
                            ? "Light is ON"
                            : "Light is OFF",

                    timer: 1000,

                    showConfirmButton: false,

                    background:
                        "rgba(255,255,255,0.06)",

                    color: "#ffffff",

                    backdrop:
                        "rgba(0,0,0,0.45)",

                    customClass: {
                        popup: "custom-swal"
                    }

                });

            }

            catch (error) {

                console.error(
                    error
                );


                Swal.fire({

                    icon: "error",

                    title: "Error",

                    text:
                        "Could not update light.",

                    customClass: {
                        popup: "custom-swal"
                    }

                });

            }

            finally {

                onBtn.disabled = false;

                offBtn.disabled = false;

            }

        }


        // Button Events
        onBtn.addEventListener(
            "click",
            () => changeLightState(true)
        );


        offBtn.addEventListener(
            "click",
            () => changeLightState(false)
        );


        // Real-time Firebase Listener
        onValue(

            lightRef,

            (snapshot) => {

                const value =
                    snapshot.val();

                updateUI(
                    value === true
                );

            },

            (error) => {

                console.error(
                    error
                );

                statusEl.textContent =
                    "Connection Error";

            }

        );

    </script>

</body>

</html>
