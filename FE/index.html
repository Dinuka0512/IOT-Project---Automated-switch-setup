<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <link rel="icon" href="data:,">


    <title>Light Control</title>


    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #111827;
        }


        .container {

            width: 350px;

            padding: 30px;

            text-align: center;

            background: #1f2937;

            border-radius: 16px;

            box-shadow: 0 10px 30px
                rgba(0, 0, 0, 0.4);
        }


        h1 {

            color: white;

            margin-bottom: 15px;
        }


        .status {

            margin-bottom: 25px;

            font-size: 20px;

            color: #9ca3af;
        }


        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;
        }


        button {

            border: none;

            padding: 12px 25px;

            border-radius: 8px;

            font-size: 16px;

            cursor: pointer;

            color: white;

            transition: 0.2s;
        }


        .on-button {

            background: #22c55e;
        }


        .off-button {

            background: #ef4444;
        }


        button:hover {

            transform: scale(1.05);
        }


        button:active {

            transform: scale(0.95);
        }

    </style>

</head>


<body>


    <div class="container">


        <h1>💡 Light Control</h1>


        <p class="status"
           id="status">

            Checking status...

        </p>


        <div class="buttons">


            <button
                class="on-button"
                onclick="turnOn()">

                Turn On

            </button>


            <button
                class="off-button"
                onclick="turnOff()">

                Turn Off

            </button>

        </div>

    </div>


    <!-- =================================
         FIREBASE
    ================================= -->

    <script type="module">


        // =================================
        // FIREBASE IMPORTS
        // =================================

        import {

            initializeApp

        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";


        import {

            getDatabase,

            ref,

            set,

            onValue

        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


        // =================================
        // FIREBASE CONFIG
        // =================================

        const firebaseConfig = {


            apiKey:

                "AIzaSyB8YbWMEOLP3T9oqNibQOx3hXhcmXmzn9A",


            authDomain:

                "led-automated-switch.firebaseapp.com",


            projectId:

                "led-automated-switch",


            storageBucket:

                "led-automated-switch.firebasestorage.app",


            messagingSenderId:

                "313118537988",


            appId:

                "1:313118537988:web:2d3fd8f473ffdeb9637851",


            measurementId:

                "G-5JX5NGDHN0"

        };


        // =================================
        // INITIALIZE FIREBASE
        // =================================

        const app = initializeApp(
            firebaseConfig
        );


        // =================================
        // INITIALIZE DATABASE
        // =================================

        const database = getDatabase(
            app
        );


        // =================================
        // LIGHT DATABASE REFERENCE
        // =================================

        const lightRef = ref(

            database,

            "devices/light"

        );


        // =================================
        // TURN LIGHT ON
        // =================================

        window.turnOn = function () {


            set(

                lightRef,

                true

            )

            .then(() => {


                console.log(
                    "Light turned ON"
                );


            })

            .catch((error) => {


                console.error(error);


                updateStatus(
                    "❌ Database Error"
                );

            });

        };


        // =================================
        // TURN LIGHT OFF
        // =================================

        window.turnOff = function () {


            set(

                lightRef,

                false

            )

            .then(() => {


                console.log(
                    "Light turned OFF"
                );


            })

            .catch((error) => {


                console.error(error);


                updateStatus(
                    "❌ Database Error"
                );

            });

        };


        // =================================
        // LISTEN TO LIGHT STATUS
        // =================================

        onValue(

            lightRef,

            (snapshot) => {


                const lightState =
                    snapshot.val();


                console.log(

                    "Current Light State:",

                    lightState

                );


                if (

                    lightState === true

                ) {


                    updateStatus(

                        "💡 Light is ON"

                    );

                }


                else {


                    updateStatus(

                        "🔴 Light is OFF"

                    );

                }

            }

        );


        // =================================
        // UPDATE UI STATUS
        // =================================

        function updateStatus(message) {


            document

                .getElementById("status")

                .textContent = message;

        }


    </script>


</body>

</html>
