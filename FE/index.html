<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Light Control · Pro</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Arial, sans-serif;
            background: #0a0a0f;
            transition: background 0.8s ease;
            overflow: hidden;
        }

        body.light-on {
            background: #1a1410;
        }

        .container {
            position: relative;
            width: 420px;
            padding: 48px 36px 40px;
            border-radius: 64px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 0.5px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 50px 100px -30px rgba(0, 0, 0, 0.9),
                inset 0 0 0 0.5px rgba(255, 255, 255, 0.06),
                inset 0 2px 8px rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        .container::before {
            content: "";
            position: absolute;
            inset: -30%;
            background:
                radial-gradient(
                    circle at 30% 20%,
                    rgba(255, 255, 255, 0.07),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(120, 160, 255, 0.04),
                    transparent 40%
                );
            filter: blur(35px);
            animation: liquidFlow 14s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes liquidFlow {
            0% {
                transform: translate(-3%, -3%) scale(1);
            }

            100% {
                transform: translate(4%, 4%) scale(1.12);
            }
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #f1f5f9;
        }

        .brand {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 8px;
        }

        h1 {
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #f8fafc 30%, #94a3b8 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.6px;
            margin-bottom: 36px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: inline-block;
        }

        .status-display {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 36px;
            padding: 32px 20px 28px;
            border-radius: 48px;
            background: rgba(255, 255, 255, 0.02);
            border: 0.5px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
            transition: all 0.8s ease;
        }

        .status-display::before {
            content: "";
            position: absolute;
            inset: -30px;
            opacity: 0;
            filter: blur(30px);
            transition: all 1s ease;
        }

        .status-display.on::before {
            opacity: 1;
            background: radial-gradient(
                circle at center,
                rgba(255, 220, 160, 0.25),
                rgba(255, 200, 100, 0.08) 40%,
                transparent 75%
            );
            animation: lightPulse 3s ease-in-out infinite;
        }

        @keyframes lightPulse {
            0%, 100% {
                opacity: 0.7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        .status-label,
        .status,
        .state-dot {
            position: relative;
            z-index: 1;
        }

        .status-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.2);
            margin-bottom: 12px;
        }

        .status {
            font-size: 34px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .status.on {
            color: #f5e6d3;
            text-shadow: 0 0 40px rgba(255, 200, 100, 0.2);
        }

        .status.off {
            color: rgba(255, 255, 255, 0.35);
        }

        .state-dot {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.8s ease;
        }

        .state-dot.on {
            background: radial-gradient(circle at 30% 30%, #fff8ee, #f5e0c0);
            box-shadow:
                0 0 60px rgba(255, 200, 100, 0.15),
                0 0 120px rgba(255, 200, 100, 0.05);
            animation: bulbPulse 3s ease-in-out infinite;
        }

        @keyframes bulbPulse {
            0%, 100% {
                box-shadow:
                    0 0 60px rgba(255, 200, 100, 0.15),
                    0 0 120px rgba(255, 200, 100, 0.05);
            }

            50% {
                box-shadow:
                    0 0 80px rgba(255, 200, 100, 0.25),
                    0 0 160px rgba(255, 200, 100, 0.08);
            }
        }

        .state-dot.off {
            background: rgba(255, 255, 255, 0.04);
            box-shadow: none;
            animation: none;
        }

        .buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
        }

        button {
            flex: 1;
            padding: 20px 14px;
            border: none;
            border-radius: 60px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-on {
            background: rgba(52, 211, 153, 0.06);
            color: #a7f3d0;
        }

        .btn-on:hover {
            background: rgba(52, 211, 153, 0.14);
            transform: translateY(-2px);
        }

        .btn-off {
            background: rgba(248, 113, 113, 0.04);
            color: #fca5a5;
        }

        .btn-off:hover {
            background: rgba(248, 113, 113, 0.10);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.95) !important;
        }

        button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .footer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.1);
            letter-spacing: 0.8px;
            padding-top: 8px;
            border-top: 0.5px solid rgba(255, 255, 255, 0.03);
        }

        .footer span {
            color: rgba(255, 255, 255, 0.2);
        }

        /* =================================
           LIQUID GLASS SWEET ALERT
        ================================= */

        .custom-swal {
            position: relative !important;
            overflow: hidden !important;
            border-radius: 34px !important;
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.075),
                    rgba(255, 255, 255, 0.025)
                ) !important;
            backdrop-filter: blur(40px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(40px) saturate(180%) !important;
            border: 0.5px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.75),
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                inset 0 -1px 0 rgba(255, 255, 255, 0.02) !important;
        }

        .custom-swal::before {
            content: "";
            position: absolute;
            inset: -50%;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 255, 255, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(120, 160, 255, 0.05),
                    transparent 35%
                );
            filter: blur(30px);
            animation: alertLiquid 8s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes alertLiquid {
            0% {
                transform: translate(-5%, -5%) rotate(-3deg) scale(1);
            }

            100% {
                transform: translate(5%, 5%) rotate(3deg) scale(1.1);
            }
        }

        .custom-swal > * {
            position: relative;
            z-index: 1;
        }

        .custom-swal .swal2-title {
            color: #f1f5f9 !important;
            font-weight: 600 !important;
            font-size: 24px !important;
        }

        .custom-swal .swal2-html-container {
            color: rgba(255, 255, 255, 0.55) !important;
        }

        /* Hide SweetAlert's default timer progress bar */
        .custom-swal .swal2-timer-progress-bar {
            display: none !important;
        }

        /* Custom progress bar */
        #swalProgress {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.8),
                rgba(150, 180, 255, 0.8)
            );
            box-shadow: 0 0 25px rgba(150, 180, 255, 0.25);
            transition: width 0.1s linear;
        }

        @media (max-width: 480px) {
            .container {
                width: 100%;
                padding: 36px 20px 32px;
                border-radius: 48px;
            }

            .buttons {
                flex-direction: column;
            }

            .status {
                font-size: 28px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container" id="container">

        <div class="content">

            <div class="brand">· iot ·</div>

            <h1>Light Control</h1>

            <div class="subtitle">
                developed by Dinuka dev
            </div>

            <div class="status-display" id="statusDisplay">

                <div class="status-label">
                    current state
                </div>

                <div class="status off" id="status">
                    Connecting...
                </div>

                <div class="state-dot off" id="stateDot">
                    💡
                </div>

            </div>

            <div class="buttons">

                <button class="btn-on" id="onButton">
                    Turn On
                </button>

                <button class="btn-off" id="offButton">
                    Turn Off
                </button>

            </div>

            <div class="footer">
                <span>✦</span>
                real-time · iot
                <span>✦</span>
            </div>

        </div>

    </div>

    <script type="module">

        // Firebase imports
        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            set,
            onValue
        } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";


        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB8YbWMEOLP3T9oqNibQOx3hXhcmXmzn9A",
            authDomain: "led-automated-switch.firebaseapp.com",
            projectId: "led-automated-switch",
            storageBucket: "led-automated-switch.firebasestorage.app",
            messagingSenderId: "313118537988",
            appId: "1:313118537988:web:2d3fd8f473ffdeb9637851",
            measurementId: "G-5JX5NGDHN0"
        };


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        const database = getDatabase(app);

        const lightRef = ref(
            database,
            "devices/light"
        );


        // DOM elements
        const body = document.body;

        const statusEl =
            document.getElementById("status");

        const statusDisplay =
            document.getElementById("statusDisplay");

        const dotEl =
            document.getElementById("stateDot");

        const onBtn =
            document.getElementById("onButton");

        const offBtn =
            document.getElementById("offButton");


        // Update UI
        function updateUI(lightState) {

            if (lightState === true) {

                statusEl.textContent = "On";

                statusEl.className = "status on";

                statusDisplay.className =
                    "status-display on";

                dotEl.className =
                    "state-dot on";

                body.classList.add("light-on");

            } else {

                statusEl.textContent = "Off";

                statusEl.className = "status off";

                statusDisplay.className =
                    "status-display";

                dotEl.className =
                    "state-dot off";

                body.classList.remove("light-on");
            }
        }


        // Show liquid glass loading alert
        function showDelayAlert(targetState) {

            return new Promise((resolve) => {

                const titleText =
                    targetState
                        ? "Turning On"
                        : "Turning Off";


                Swal.fire({

                    title: titleText,

                    html: `
                        <div style="
                            margin: 16px 0 12px;
                            font-size: 0.9rem;
                            opacity: 0.55;
                            letter-spacing: 0.5px;
                        ">
                            ⏳ Processing request
                        </div>

                        <div style="
                            width: 100%;
                            height: 4px;
                            background: rgba(255,255,255,0.08);
                            border-radius: 20px;
                            overflow: hidden;
                            box-shadow:
                                inset 0 1px 3px rgba(0,0,0,0.3),
                                0 0 15px rgba(255,255,255,0.03);
                        ">
                            <div id="swalProgress"></div>
                        </div>

                        <div style="
                            margin-top: 14px;
                            font-size: 0.7rem;
                            opacity: 0.25;
                            letter-spacing: 1px;
                        ">
                            · updating device ·
                        </div>
                    `,

                    showConfirmButton: false,

                    allowOutsideClick: false,

                    backdrop: "rgba(10,10,15,0.72)",

                    timer: 5000,

                    // Important: no default SweetAlert progress bar
                    timerProgressBar: false,

                    customClass: {
                        popup: "custom-swal"
                    },

                    didOpen: () => {

                        const progressBar =
                            document.getElementById(
                                "swalProgress"
                            );

                        const startTime =
                            Date.now();

                        const duration = 5000;


                        function updateProgress() {

                            const elapsed =
                                Date.now() -
                                startTime;

                            const percentage =
                                Math.min(
                                    (elapsed / duration) * 100,
                                    100
                                );

                            progressBar.style.width =
                                percentage + "%";


                            if (percentage < 100) {

                                requestAnimationFrame(
                                    updateProgress
                                );
                            }
                        }

                        requestAnimationFrame(
                            updateProgress
                        );
                    }

                }).then(() => {

                    resolve();

                });

            });
        }


        // Change light state
        async function changeLightState(newState) {

            onBtn.disabled = true;

            offBtn.disabled = true;


            try {

                // Update Firebase
                await set(
                    lightRef,
                    newState
                );


                // Show loading alert
                await showDelayAlert(
                    newState
                );


                // Update UI
                updateUI(
                    newState
                );


                // Success alert
                await Swal.fire({

                    icon: newState
                        ? "success"
                        : "info",

                    title: newState
                        ? "Light is ON"
                        : "Light is OFF",

                    timer: 1200,

                    showConfirmButton: false,

                    timerProgressBar: false,

                    background:
                        "rgba(255,255,255,0.05)",

                    color: "#f1f5f9",

                    backdrop:
                        "rgba(10,10,15,0.72)",

                    customClass: {
                        popup: "custom-swal"
                    }

                });

            } catch (error) {

                console.error(
                    error
                );


                Swal.fire({

                    icon: "error",

                    title: "Error",

                    text:
                        "Could not update light.",

                    background:
                        "rgba(255,255,255,0.05)",

                    color: "#f1f5f9",

                    customClass: {
                        popup: "custom-swal"
                    }

                });

            } finally {

                onBtn.disabled = false;

                offBtn.disabled = false;
            }
        }


        // Button events
        onBtn.addEventListener(
            "click",
            () => changeLightState(true)
        );

        offBtn.addEventListener(
            "click",
            () => changeLightState(false)
        );


        // Real-time Firebase listener
        onValue(

            lightRef,

            (snapshot) => {

                const value =
                    snapshot.val();

                updateUI(
                    value === true
                );
            },

            (error) => {

                console.error(
                    error
                );

                statusEl.textContent =
                    "Connection Error";
            }
        );

    </script>

</body>
</html>
